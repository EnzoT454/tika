# IFT3913 : suite finale retenue, controles du projet et mutation.
name: IFT3913 tache 2 - tests et mutation

'on':
  push:
    branches: [main, tache2-final]
  pull_request:
    branches: [main, tache2-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-et-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Construire et tester toute la suite tika-core
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -pl tika-core -am clean install 2>&1 | tee tache2-build.log
      - name: Verifier les 217 nouveaux cas acceptes
        if: ${{ always() }}
        run: python3 .github/scripts/check-tache2-tests.py
      - name: Mesurer les trois classes avec la configuration PIT finale
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -pl tika-core -Pmutation org.pitest:pitest-maven:mutationCoverage 2>&1 | tee tache2-pit.log
      - name: Resumer les statuts PIT separement
        if: ${{ always() }}
        run: python3 .github/scripts/summarize-tache2-pit.py
      - name: Conserver les rapports et journaux
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tache2-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            tache2-build.log
            tache2-pit.log
            .github/scripts/tache2-expected-tests.json
            tika-core/target/surefire-reports/
            tika-core/target/checkstyle-result.xml
            tika-core/target/site/jacoco/
            tika-core/target/pit-reports/
            tika-annotation-processor/target/surefire-reports/
            tika-annotation-processor/target/checkstyle-result.xml
