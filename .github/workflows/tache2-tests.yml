name: Tâche 2 — tests tika-core

'on':
  push:
    branches: [main, tache2-tests]
  pull_request:
    branches: [main, tache2-tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compiler, tester et vérifier tika-core
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -pl tika-core -am clean verify 2>&1 | tee tache2-build.log

      - name: Vérifier les douze nouveaux cas de test
        if: ${{ always() }}
        run: python3 .github/scripts/check-tache2-tests.py

      - name: Conserver les rapports et le journal
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tache2-tests-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            tache2-build.log
            tika-core/target/surefire-reports/
            tika-core/target/site/jacoco/
            tika-core/target/checkstyle-result.xml
            tika-annotation-processor/target/surefire-reports/
